<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>salesBlanket v4</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      height: 100%;
      font-family: 'Open Sans', sans-serif;
      background-color: #f5f5f5;
    }
    
    #app {
      height: 100%;
    }
    
    /* Porsche-inspired color palette */
    :root {
      --brewster-green: #2F4F2F;
      --eberle-green: #1E4A43;
      --fjord: #3B7B9E;
      --golf-blau: #1A3A59;
      --shark-blue: #2D4A71;
      --carmine-red: #960018;
      --racing-yellow: #FFC20E;
      --lime-green: #9CCB19;
      --chalk: #C9C8C0;
      --agate-grey: #4B5358;
    }
    
    /* Loading spinner */
    .app-loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: var(--golf-blau);
      color: white;
      z-index: 9999;
      transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
    }
    
    .app-loading.hidden {
      opacity: 0;
      visibility: hidden;
    }
    
    .app-loading-title {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 1rem;
    }
    
    .app-loading-version {
      font-size: 0.9rem;
      opacity: 0.8;
      margin-bottom: 2rem;
    }
    
    .spinner {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: var(--racing-yellow);
      animation: spin 1s ease-in-out infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Initial loading screen -->
  <div class="app-loading" id="loading">
    <div class="app-loading-title">salesBlanket</div>
    <div class="app-loading-version">version .4</div>
    <div class="spinner"></div>
  </div>
  
  <!-- Application mount point -->
  <div id="app"></div>
  
  <!-- Application entry point -->
  <script type="module" src="src/js/app.js"></script>
  
  <!-- Hide loading screen once app is loaded -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const loading = document.getElementById('loading');
        if (loading) {
          loading.classList.add('hidden');
          // Remove from DOM after animation completes
          setTimeout(() => {
            loading.remove();
          }, 500);
        }
      }, 1000); // Simulated loading time
    });
  </script>
</body>
</html>
